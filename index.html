<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bitmovin Player Playground</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #0f172a;
            color: #f8fafc;
            display: -webkit-flex;
            display: flex;
            -webkit-flex-direction: column;
            flex-direction: column;
            -webkit-align-items: center;
            align-items: center;
            min-height: 100vh;
        }

        header {
            width: 100%;
            padding: 24px;
            text-align: center;
            background-color: #1e293b;
            border-bottom: 1px solid #334155;
            margin-bottom: 32px;
            box-sizing: border-box;
        }

        header h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 600;
        }

        .container {
            display: -webkit-flex;
            display: flex;
            -webkit-flex-direction: column;
            flex-direction: column;
            width: 100%;
            max-width: 1000px;
            padding: 0 20px 32px 20px;
            box-sizing: border-box;
        }

        .controls {
            background-color: #1e293b;
            padding: 16px;
            border-radius: 12px;
            border: 1px solid #334155;
            display: -webkit-flex;
            display: flex;
            -webkit-flex-wrap: wrap;
            flex-wrap: wrap;
            margin-bottom: 24px;
            box-sizing: border-box;
        }

        .control-group {
            display: -webkit-flex;
            display: flex;
            -webkit-flex-direction: column;
            flex-direction: column;
            width: 50%;
            padding: 8px;
            box-sizing: border-box;
        }

        .control-group.full-width {
            width: 100%;
        }

        label {
            font-size: 14px;
            color: #94a3b8;
            font-weight: 500;
            margin-bottom: 8px;
        }

        input, select, textarea {
            background-color: #0f172a;
            border: 1px solid #334155;
            color: #f8fafc;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            -webkit-transition: border-color 0.2s;
            transition: border-color 0.2s;
            font-family: 'Inter', sans-serif;
            box-sizing: border-box;
            width: 100%;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
            font-family: monospace;
        }

        input:focus, select:focus, textarea:focus {
            border-color: #3382f6;
        }

        .button-wrapper {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            -webkit-transition: background-color 0.2s, -webkit-transform 0.1s;
            transition: background-color 0.2s, transform 0.1s;
            box-sizing: border-box;
        }

        button:hover {
            background-color: #2563eb;
        }

        button:active {
            -webkit-transform: scale(0.98);
            transform: scale(0.98);
        }

        .player-wrapper {
            background-color: #1e293b;
            padding: 16px;
            border-radius: 12px;
            border: 1px solid #334155;
            display: -webkit-flex;
            display: flex;
            -webkit-justify-content: center;
            justify-content: center;
            -webkit-align-items: center;
            align-items: center;
            min-height: 400px;
            position: relative;
            box-sizing: border-box;
            width: 100%;
        }

        .player-aspect-wrapper {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 Aspect Ratio */
            display: none;
        }

        #player-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        
        .empty-state {
            position: absolute;
            color: #94a3b8;
            font-size: 16px;
            pointer-events: none;
        }

        .error-message {
            color: #ef4444;
            background: rgba(239, 68, 68, 0.1);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #ef4444;
            display: none;
            width: 100%;
            margin: 8px;
            box-sizing: border-box;
        }

        @media (max-width: 640px) {
            .control-group {
                width: 100%;
            }
        }
    </style>
    <!-- Atresmedia target socket for smart tv debug -->
    <script src="https://tv-socket.atresmedia.com/target.js"></script>
    <!-- Polyfills for legacy engines (Chromium 38 / webOS 3.0 / Smart TVs) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/core-js/3.38.1/minified.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bitmovin-player@8/modules/bitmovinplayer-polyfill.js"></script>
</head>
<body>

    <header>
        <h1>Bitmovin Player Playground</h1>
    </header>

    <div class="container">
        <div class="controls">
            <div id="error-box" class="error-message"></div>

            <div class="control-group">
                <label for="player-version">Player Version</label>
                <input type="text" id="player-version" value="8" placeholder="e.g. 8, 8.180.0, 8.170.0">
            </div>

            <div class="control-group">
                <label for="stream-type">Stream Type</label>
                <select id="stream-type">
                    <option value="hls">HLS</option>
                    <option value="dash">DASH</option>
                    <option value="progressive">Progressive (MP4)</option>
                </select>
            </div>

            <div class="control-group full-width">
                <label for="stream-url">Stream URL</label>
                <input type="text" id="stream-url" value="https://bitmovin-a.akamaihd.net/content/MI201109210084_1/m3u8s/f08e80da-bf1d-4e3d-8899-f0f6155f6efa.m3u8">
            </div>

            <div class="control-group full-width">
                <label for="license-key">License Key (Optional for localhost)</label>
                <input type="text" id="license-key" value="" placeholder="Your Bitmovin Player License Key">
            </div>

            <div class="control-group full-width">
                <label for="player-config">Player Configuration (JSON)</label>
                <textarea id="player-config" placeholder='{&#10;  "playback": {&#10;    "autoplay": true&#10;  }&#10;}'></textarea>
            </div>

            <div class="button-wrapper">
                <button id="load-btn">Load Player</button>
            </div>
        </div>

        <div class="player-wrapper">
            <div id="empty-state" class="empty-state">Click "Load Player" to initialize</div>
            <div id="player-aspect-wrapper" class="player-aspect-wrapper">
                <div id="player-container"></div>
            </div>
        </div>
    </div>

    <script>
        var playerInstance = null;
        var isPlayerLoading = false;

        // UTF-8 compatible Base64 encode for ES5
        function toBase64(str) {
            try {
                return btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g, function(match, p1) {
                    return String.fromCharCode(parseInt('0x' + p1, 16));
                }));
            } catch (e) {
                return btoa(str);
            }
        }

        // UTF-8 compatible Base64 decode for ES5
        function fromBase64(str) {
            try {
                return decodeURIComponent(Array.prototype.map.call(atob(str), function(c) {
                    return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
                }).join(''));
            } catch (e) {
                try {
                    return atob(str);
                } catch (err) {
                    if (window.console && console.warn) {
                        console.warn('Base64 decode failed:', err);
                    }
                    return null;
                }
            }
        }

        // ES5 shallow object merge (Object.assign replacement)
        function extend(target) {
            var out = target || {};
            for (var i = 1; i < arguments.length; i++) {
                var source = arguments[i];
                if (source) {
                    for (var prop in source) {
                        if (Object.prototype.hasOwnProperty.call(source, prop)) {
                            out[prop] = source[prop];
                        }
                    }
                }
            }
            return out;
        }

        // Parse query string without URLSearchParams
        function getQueryParams() {
            var search = window.location.search.substring(1);
            var params = {};
            if (!search) return params;
            var pairs = search.split('&');
            for (var i = 0; i < pairs.length; i++) {
                var pair = pairs[i].split('=');
                if (pair.length >= 1 && pair[0]) {
                    var key = decodeURIComponent(pair[0]);
                    var val = pair.length > 1 ? decodeURIComponent(pair.slice(1).join('=')) : '';
                    params[key] = val;
                }
            }
            return params;
        }

        function updateUrlParams(params) {
            var parts = [];
            var keys = ['version', 'type', 'url', 'key', 'config'];
            for (var i = 0; i < keys.length; i++) {
                var key = keys[i];
                if (params[key]) {
                    parts.push(encodeURIComponent(key) + '=' + encodeURIComponent(toBase64(params[key])));
                }
            }
            var newQuery = parts.length > 0 ? '?' + parts.join('&') : '';
            var newUrl = window.location.pathname + newQuery + window.location.hash;
            if (window.history && window.history.replaceState) {
                window.history.replaceState(null, '', newUrl);
            }
        }

        function loadParamsFromUrl() {
            var params = getQueryParams();
            var rawUrl = params['url'];

            // Auto-load only if URL contains stream parameters (at minimum url)
            if (!rawUrl) return false;

            var url = fromBase64(rawUrl);
            if (!url) return false;

            var versionParam = params['version'];
            var typeParam = params['type'];
            var keyParam = params['key'];
            var configParam = params['config'];

            if (versionParam) {
                var v = fromBase64(versionParam);
                if (v !== null) document.getElementById('player-version').value = v;
            }

            if (typeParam) {
                var t = fromBase64(typeParam);
                if (t !== null) document.getElementById('stream-type').value = t;
            }

            document.getElementById('stream-url').value = url;

            if (keyParam) {
                var k = fromBase64(keyParam);
                if (k !== null) document.getElementById('license-key').value = k;
            }

            if (configParam) {
                var c = fromBase64(configParam);
                if (c !== null) document.getElementById('player-config').value = c;
            }

            return true;
        }

        function showError(msg) {
            var errorBox = document.getElementById('error-box');
            errorBox.textContent = msg;
            errorBox.style.display = 'block';
        }

        function hideError() {
            document.getElementById('error-box').style.display = 'none';
        }

        document.getElementById('load-btn').addEventListener('click', function() {
            if (isPlayerLoading) return;

            hideError();
            
            var version = document.getElementById('player-version').value.trim() || '8';
            var licenseKey = document.getElementById('license-key').value.trim();
            var streamUrl = document.getElementById('stream-url').value.trim();
            var streamType = document.getElementById('stream-type').value;
            var configStr = document.getElementById('player-config').value.trim();

            if (!streamUrl) {
                showError('Please provide a stream URL.');
                return;
            }

            // Persist parameters in URL
            updateUrlParams({
                version: version,
                type: streamType,
                url: streamUrl,
                key: licenseKey,
                config: configStr
            });

            isPlayerLoading = true;
            var btn = document.getElementById('load-btn');
            btn.textContent = 'Loading...';
            btn.style.opacity = '0.7';

            function resetButton() {
                isPlayerLoading = false;
                btn.textContent = 'Load Player';
                btn.style.opacity = '1';
            }

            // Clean up existing player
            if (playerInstance) {
                try {
                    playerInstance.destroy();
                } catch (e) {
                    if (window.console && console.warn) {
                        console.warn('Error destroying player:', e);
                    }
                }
                playerInstance = null;
            }

            // Remove old script if exists
            var oldScript = document.getElementById('bitmovin-script');
            if (oldScript && oldScript.parentNode) {
                oldScript.parentNode.removeChild(oldScript);
                if (window.bitmovin) {
                    try {
                        delete window.bitmovin;
                    } catch (e) {
                        window.bitmovin = undefined;
                    }
                }
            }

            var script = document.createElement('script');
            script.id = 'bitmovin-script';
            script.src = 'https://cdn.bitmovin.com/player/web/' + version + '/bitmovinplayer.js';
            
            script.onload = function() {
                if (!window.bitmovin || !window.bitmovin.player) {
                    showError('Failed to load Bitmovin Player version ' + version + '. Ensure the version exists.');
                    resetButton();
                    return;
                }

                document.getElementById('empty-state').style.display = 'none';
                document.getElementById('player-aspect-wrapper').style.display = 'block';

                var customConfig = {};
                if (configStr) {
                    try {
                        customConfig = JSON.parse(configStr);
                    } catch (err) {
                        showError('Invalid JSON in Player Configuration: ' + err.message);
                        resetButton();
                        return;
                    }
                }

                var defaultConfig = {
                    key: licenseKey || undefined,
                    playback: {
                        autoplay: true
                    }
                };
                var config = extend({}, defaultConfig, customConfig);
                
                // Ensure key is preserved if provided in the input but not in config JSON
                if (licenseKey && !config.key) {
                    config.key = licenseKey;
                }
                
                var container = document.getElementById('player-container');
                try {
                    playerInstance = new bitmovin.player.Player(container, config);
                    window.player = playerInstance;
                    
                    var source = {};
                    if (streamType === 'hls') {
                        source.hls = streamUrl;
                    } else if (streamType === 'dash') {
                        source.dash = streamUrl;
                    } else if (streamType === 'progressive') {
                        source.progressive = streamUrl;
                    }

                    playerInstance.load(source).then(function() {
                        if (window.console && console.log) {
                            console.log('Successfully loaded source');
                        }
                        resetButton();
                    })['catch'](function(err) {
                        if (window.console && console.error) {
                            console.error('Error loading source:', err);
                        }
                        showError('Error loading source: ' + (err && err.message ? err.message : 'Unknown error'));
                        resetButton();
                    });
                } catch (err) {
                    if (window.console && console.error) {
                        console.error('Error initializing player:', err);
                    }
                    showError('Error initializing player: ' + err.message);
                    resetButton();
                }
            };

            script.onerror = function() {
                showError('Failed to load Bitmovin Player version ' + version + ' from CDN. Ensure the version exists.');
                resetButton();
            };

            document.head.appendChild(script);
        });

        // Initialize from URL parameters on startup
        if (loadParamsFromUrl()) {
            document.getElementById('load-btn').click();
        }
    </script>
</body>
</html>
